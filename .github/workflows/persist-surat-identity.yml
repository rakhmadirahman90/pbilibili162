name: Persist latest surat identity
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: persist latest surat visual settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch surat persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/KelolaSurat.tsx')
          s=p.read_text()
          old='''  const [dragging, setDragging] = useState(false);\n\n  const fetchSurat = async () => {\n    setLoading(true);\n    const { data, error } = await supabase.from('arsip_surat').select('*').order('updated_at', { ascending: false });\n    if (error) console.error(error);\n    setSuratList(data || []);\n    setLoading(false);\n  };\n  useEffect(() => { fetchSurat(); }, []);\n'''
          new='''  const [dragging, setDragging] = useState(false);\n  const [settings, setSettings] = useState<Surat | null>(null);\n\n  const fetchSurat = async () => {\n    setLoading(true);\n    const [letters, cfg] = await Promise.all([\n      supabase.from('arsip_surat').select('*').order('updated_at', { ascending: false }),\n      supabase.from('pengaturan_surat').select('*').eq('id', 1).maybeSingle(),\n    ]);\n    if (letters.error) console.error(letters.error);\n    if (cfg.error) console.error(cfg.error);\n    const rows = letters.data || [];\n    setSuratList(rows);\n    setSettings(cfg.data || latestFirst(rows)[0] || null);\n    setLoading(false);\n  };\n  useEffect(() => { fetchSurat(); }, []);\n'''
          if old not in s: raise SystemExit('fetch block not found')
          s=s.replace(old,new)
          old='''    const latest = latestFirst(suratList)[0];\n    const last = latest?.nomor_surat || '000/PB-Bilibili162/VIII/2026';\n    const n = parseInt(last.split('/')[0], 10);\n    const next = Number.isFinite(n) ? String(n + 1).padStart(3, '0') : '001';\n    const suffix = last.includes('/') ? last.substring(last.indexOf('/')) : '/PB-Bilibili162/VIII/2026';\n    setEditId(null); setPreviewOnly(false); setFormData(applyLatestIdentity({ ...emptyForm, nomor_surat: `${next}${suffix}` }, latest)); setOpen(true);\n'''
          new='''    const latest = settings || latestFirst(suratList)[0];\n    const last = latestFirst(suratList)[0]?.nomor_surat || '000/PB-Bilibili162/VIII/2026';\n    const n = parseInt(last.split('/')[0], 10);\n    const next = Number.isFinite(n) ? String(n + 1).padStart(3, '0') : '001';\n    const suffix = last.includes('/') ? last.substring(last.indexOf('/')) : '/PB-Bilibili162/VIII/2026';\n    setEditId(null); setPreviewOnly(false); setFormData(applyLatestIdentity({ ...emptyForm, nomor_surat: `${next}${suffix}` }, latest)); setOpen(true);\n'''
          if old not in s: raise SystemExit('prepare block not found')
          s=s.replace(old,new)
          old='''      const result = editId ? await supabase.from('arsip_surat').update(payload).eq('id', editId) : await supabase.from('arsip_surat').insert([payload]);\n      if (result.error) throw result.error;\n      await fetchSurat(); setOpen(false); Swal.fire('Berhasil', editId ? 'Surat diperbarui dengan identitas terakhir.' : 'Surat disimpan.', 'success');\n'''
          new='''      const result = editId ? await supabase.from('arsip_surat').update(payload).eq('id', editId) : await supabase.from('arsip_surat').insert([payload]);\n      if (result.error) throw result.error;\n\n      const identity = {\n        id: 1, logo_url: payload.logo_url || null, ttd_ketua_url: payload.ttd_ketua_url || null,\n        ttd_sekretaris_url: payload.ttd_sekretaris_url || null, cap_stempel_url: payload.cap_stempel_url || null,\n        nama_ketua: payload.nama_ketua || null, nama_sekretaris: payload.nama_sekretaris || null,\n        logo_scale: payload.logo_scale ?? 100, ttd_ketua_scale: payload.ttd_ketua_scale ?? 100,\n        ttd_sekretaris_scale: payload.ttd_sekretaris_scale ?? 100, stempel_scale: payload.stempel_scale ?? 100,\n        logo_pos: payload.logo_pos || { x: 0, y: 0 }, ttd_ketua_pos: payload.ttd_ketua_pos || { x: 0, y: 0 },\n        ttd_sekretaris_pos: payload.ttd_sekretaris_pos || { x: 0, y: 0 }, stempel_pos: payload.stempel_pos || { x: -40, y: 0 },\n        updated_at: new Date().toISOString(),\n      };\n      const { error: identityError } = await supabase.from('pengaturan_surat').upsert(identity, { onConflict: 'id' });\n      if (identityError) throw identityError;\n      setSettings(identity);\n      await fetchSurat(); setOpen(false); Swal.fire('Berhasil', 'Ukuran dan posisi TTD Ketua, TTD Sekretaris, serta stempel tersimpan sebagai perubahan terakhir.', 'success');\n'''
          if old not in s: raise SystemExit('save block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/KelolaSurat.tsx
          git diff --cached --quiet || git commit -m 'fix: persist latest surat visual settings'
          git push
